<IfModule mod_brotli.c>
    # Calidad de compresión (Cambiar a 5 o 11 para las mediciones)
    BrotliCompressionQuality 11
    BrotliCompressionWindow 22

    # Comprimir los tipos MIME solicitados
    AddOutputFilterByType BROTLI_COMPRESS text/plain text/html text/xml text/css application/javascript text/javascript application/json image/svg+xml

    # EXCLUSIONES: No comprimir archivos ya empaquetados/imágenes
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|rar|gz|pdf)$ no-brotli dont-vary
</IfModule>

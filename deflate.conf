<IfModule mod_deflate.c>
    # Nivel de compresión (Cambiar a 1, 6 o 9 para las mediciones)
    DeflateCompressionLevel 9

    # Comprimir los tipos MIME solicitados
    AddOutputFilterByType DEFLATE text/plain text/html text/css text/xml application/javascript text/javascript application/json image/svg+xml

    # EXCLUSIONES: No comprimir imágenes, videos ni empaquetados
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|rar|gz|pdf)$ no-gzip dont-vary
</IfModule>
